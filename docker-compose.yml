version: '3.3'

services:
  axels-api:
    container_name: axels-api
    restart: always
    image: node:20.10.0
    ports:
      - "4001:3005"
    volumes:
      - ./:/usr/src/axels
    working_dir: /usr/src/axels
    
    networks:
      - monorepo-network

    # For Production
    command: bash -c "npm install && npm run build && npm run start:prod"

  axels-batch:
    container_name: axels-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - "4002:3006"
    volumes:
      - ./:/usr/src/axels
    working_dir: /usr/src/axels
    
    networks:
      - monorepo-network

    # For Production
    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge